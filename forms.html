<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Forms</title></head>
<body>
<!-- Netlify reads these at deploy time so it knows which form submissions to accept. The site itself sends them from index.html. -->
<form name="enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="name"><input name="email"><input name="phone"><input name="postcode"><input name="type"><input name="stage"><textarea name="message"></textarea><input name="bot-field">
</form>
<form name="call-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="name"><input name="email"><input name="phone"><input name="call_type"><input name="requested_time"><textarea name="project"></textarea><input name="bot-field">
</form>
</body></html>
